<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Chess Sandbox</title>
    
    <!-- Chessboard CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />
    
    <!-- jQuery & Chessboard JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 8px;
            background: transparent;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        
        /* Fixed container width so WRAP_CONTENT never blows up on maximize */
        #main-container {
            width: 320px;
            box-sizing: border-box;
            margin: 0 auto;
        }

        #myBoard {
            width: 100%;
            margin: 0 auto;
        }

        .controls {
            text-align: center;
            margin-top: 8px;
        }
        
        button {
            padding: 6px 10px;
            margin: 2px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            background-color: #555;
        }

        /* Mobile-Friendly Piece Palette */
        .palette {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 6px;
            background: #f0f0f0;
            padding: 4px;
            border-radius: 6px;
        }

        .palette img {
            width: 30px;
            height: 30px;
            padding: 2px;
            border: 2px solid transparent;
            border-radius: 4px;
        }

        .palette img.selected {
            border-color: #007bff;
            background-color: #d0e1ff;
        }

        #bubble-icon {
            display: none; 
            font-size: 40px; 
            cursor: pointer; 
            text-align: center; 
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            line-height: 60px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin: 0 auto;
        }
    </style>
</head>
<body>

<!-- Main Container -->
<div id="main-container">
    
    <!-- The Chessboard -->
    <div id="myBoard"></div>

    <!-- Spare Pieces -->
    <div id="spare-pieces">
        <div class="palette" id="piecePalette">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/wP.png" data-piece="wP" alt="White Pawn">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/wN.png" data-piece="wN" alt="White Knight">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/wB.png" data-piece="wB" alt="White Bishop">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/wR.png" data-piece="wR" alt="White Rook">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/wQ.png" data-piece="wQ" alt="White Queen">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/wK.png" data-piece="wK" alt="White King">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/bP.png" data-piece="bP" alt="Black Pawn">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/bN.png" data-piece="bN" alt="Black Knight">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/bB.png" data-piece="bB" alt="Black Bishop">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/bR.png" data-piece="bR" alt="Black Rook">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/bQ.png" data-piece="bQ" alt="Black Queen">
            <img src="https://chessboardjs.com/img/chesspieces/wikipedia/bK.png" data-piece="bK" alt="Black King">
        </div>
    </div>

    <!-- Action Controls -->
    <div id="utility-panel" class="controls">
        <button id="undoBtn">↺ Undo</button>
        <button id="resetBtn">Reset</button>
        <button id="clearBtn">Clear</button>
        <button id="flipBtn">Flip</button>
        <button id="move-btn" style="opacity: 0.5;">Move</button>
        <button id="hide-btn">Hide</button>
        <button id="minimize-btn">Minimize</button>
    </div>

    <!-- Unhide Button -->
    <div style="text-align: center; margin-top: 5px;">
        <button id="unhide-btn" style="display: none;">Unhide</button>
    </div>

</div>

<!-- Bubble Icon -->
<div id="bubble-icon">♟️</div>


<script>
    let history = [];
    let selectedPiece = null;

    function pieceTheme(piece) {
        return 'https://chessboardjs.com/img/chesspieces/wikipedia/' + piece + '.png';
    }

    function saveHistory() {
        if (typeof board !== 'undefined') {
            history.push(board.fen());
        }
    }

    const config = {
        draggable: true,
        dropOffBoard: 'trash', 
        sparePieces: false,    
        position: 'start',
        pieceTheme: pieceTheme
    };

    var board = Chessboard('myBoard', config);
    history.push(board.fen());

    // --- Tap-to-Place Spare Piece Palette ---
    $('#piecePalette img').on('click touchstart', function (e) {
        e.preventDefault();
        const clickedPiece = $(this).attr('data-piece');

        if (selectedPiece === clickedPiece) {
            selectedPiece = null;
            $('#piecePalette img').removeClass('selected');
        } else {
            selectedPiece = clickedPiece;
            $('#piecePalette img').removeClass('selected');
            $(this).addClass('selected');
        }
    });

    $('#myBoard').on('click touchstart', '.square-55d63', function (e) {
        if (selectedPiece) {
            e.preventDefault();
            const square = $(this).attr('data-square');
            const currentPosition = board.position();
            currentPosition[square] = selectedPiece;
            board.position(currentPosition, false);
            saveHistory();
        }
    });

    function onDragStart(source, piece, position, orientation) {
        if (selectedPiece) return false; 
        return true;
    }

    function onDrop(source, target, piece, newPos, oldPos, orientation) {
        setTimeout(saveHistory, 100);
    }

    config.onDragStart = onDragStart;
    config.onDrop = onDrop;
    board = Chessboard('myBoard', config);

    // --- Controls Handlers ---
    $('#undoBtn').on('click', () => {
        if (history.length > 1) {
            history.pop();
            board.position(history[history.length - 1], true);
        }
    });

    $('#resetBtn').on('click', () => {
        board.start();
        history = [board.fen()];
        selectedPiece = null;
        $('#piecePalette img').removeClass('selected');
    });

    $('#clearBtn').on('click', () => {
        board.clear();
        history = [board.fen()];
        selectedPiece = null;
        $('#piecePalette img').removeClass('selected');
    });

    $('#flipBtn').on('click', () => {
        board.flip();
    });

    // --- Window State UI Handlers ---
    const utilityPanel = document.getElementById('utility-panel');
    const sparePieces = document.getElementById('spare-pieces');
    const hideBtn = document.getElementById('hide-btn');
    const unhideBtn = document.getElementById('unhide-btn');
    const moveBtn = document.getElementById('move-btn');
    const minimizeBtn = document.getElementById('minimize-btn');
    const bubbleIcon = document.getElementById('bubble-icon');
    const mainContainer = document.getElementById('main-container');

    let moveModeActive = false;

    // Measures the real rendered height of the given element and sends it to
    // Android as raw pixels — used ONLY at startup to establish the two
    // baseline sizes below. Never called again after that, so there's no
    // opportunity for measurement to compound across cycles.
    function measureHeight(el) {
        const cssHeight = el.getBoundingClientRect().height;
        const dpr = window.devicePixelRatio || 1;
        return Math.ceil(cssHeight * dpr);
    }

    function sendHeight(px) {
        if (px === null || px === undefined || px <= 0) return;
        if (!window.AndroidBridge || !window.AndroidBridge.updateContentHeight) return;
        console.log('sendHeight: ' + px);
        AndroidBridge.updateContentHeight(px);
    }

    // Fixed, one-time-measured heights. These are set ONCE on load and then
    // reused for every future minimize/maximize/hide/unhide — we never
    // re-measure a live element again, which is what caused the size to
    // creep upward on every cycle before.
    let expandedHeightPx = null;
    let bubbleHeightPx = null;

    // Hide / Unhide — panel/palette visibility changes the natural height,
    // so we keep a third cached value for the "hidden" state too.
    let hiddenHeightPx = null;

    hideBtn.addEventListener('click', () => {
        utilityPanel.style.display = 'none';
        sparePieces.style.display = 'none';
        unhideBtn.style.display = 'inline-block';
        if (hiddenHeightPx === null) hiddenHeightPx = measureHeight(mainContainer);
        sendHeight(hiddenHeightPx);
    });

    unhideBtn.addEventListener('click', () => {
        utilityPanel.style.display = 'block';
        sparePieces.style.display = 'block';
        unhideBtn.style.display = 'none';
        sendHeight(expandedHeightPx);
    });

    // Move toggle
    moveBtn.addEventListener('click', () => {
        moveModeActive = !moveModeActive;
        if (window.AndroidBridge) {
            AndroidBridge.toggleMoveMode(moveModeActive);
        }
        moveBtn.style.opacity = moveModeActive ? '1' : '0.5';
        moveBtn.style.backgroundColor = moveModeActive ? '#4CAF50' : '#333';
    });

    // Minimize / Maximize — always send the SAME cached numbers, never a
    // freshly re-measured one.
    minimizeBtn.addEventListener('click', () => {
        mainContainer.style.display = 'none';
        bubbleIcon.style.display = 'block';
        if (window.AndroidBridge) {
            AndroidBridge.minimizeWindow();
        }
        sendHeight(bubbleHeightPx);
    });

    bubbleIcon.addEventListener('click', () => {
        mainContainer.style.display = 'block';
        bubbleIcon.style.display = 'none';
        if (window.AndroidBridge) {
            AndroidBridge.maximizeWindow();
        }
        sendHeight(expandedHeightPx);
    });

    // Establish the two baseline sizes ONCE, right after everything has
    // rendered for the first time. These numbers are then reused for the
    // rest of the app's lifetime — no further measuring, no compounding.
    function initCachedHeights() {
        expandedHeightPx = measureHeight(mainContainer);

        const wasHidden = bubbleIcon.style.display === 'none';
        if (wasHidden) {
            bubbleIcon.style.visibility = 'hidden';
            bubbleIcon.style.display = 'block';
        }
        bubbleHeightPx = measureHeight(bubbleIcon);
        if (wasHidden) {
            bubbleIcon.style.display = 'none';
            bubbleIcon.style.visibility = '';
        }

        console.log('initCachedHeights: expanded=' + expandedHeightPx + ' bubble=' + bubbleHeightPx);
        if (window.AndroidBridge && window.AndroidBridge.reportCachedHeights) {
            AndroidBridge.reportCachedHeights(expandedHeightPx, bubbleHeightPx);
        }
        sendHeight(expandedHeightPx);
    }

    // 'load' only fires once — if it already fired before this script ran
    // (very likely, since this runs after jQuery/chessboard.js init), a
    // listener added now would silently never trigger, leaving both cached
    // values stuck at null forever. Check readyState to cover both cases.
    if (document.readyState === 'complete') {
        setTimeout(initCachedHeights, 100);
    } else {
        window.addEventListener('load', () => setTimeout(initCachedHeights, 100));
    }
</script>
</body>
</html>
